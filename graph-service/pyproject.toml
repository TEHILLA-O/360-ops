[project]
name = "opspilot365-graph-service"
version = "0.1.0"
description = "OpsPilot 365 local case service and Microsoft Graph integration."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
