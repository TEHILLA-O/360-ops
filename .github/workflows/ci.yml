name: OpsPilot 365 CI

on:
  push:
  pull_request:

jobs:
  graph-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Power Platform solution checks are intentionally absent.
  # pac is not authenticated in this project, and there is no exported solution to validate.
